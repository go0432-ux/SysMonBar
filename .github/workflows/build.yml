name: Build

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build app + dmg
        run: |
          chmod +x build.sh make-dmg.sh
          ./build.sh
          ./make-dmg.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SysMonBar-dmg
          path: dist/SysMonBar.dmg

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SysMonBar.dmg
